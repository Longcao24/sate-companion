apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.sateasc'
version = '0.1.0'

android {
  namespace "expo.modules.sateasc"

  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }

  // The vendor ASC decoder is a plain ELF .so loaded with System.loadLibrary.
  // Legacy packaging keeps it compressed and extracted at install time, matching
  // the configuration the codec was verified under in the reference app — one
  // less variable in a binary we cannot rebuild.
  packagingOptions {
    jniLibs {
      useLegacyPackaging true
    }
  }

  // `src/main/jniLibs/` is EMPTY in a fresh clone: the two binaries are
  // proprietary and git-ignored (see ../README.md). That is deliberate — a
  // missing .so is a RUNTIME "decoder unavailable", never a build failure, so
  // the recorder-only Android build still compiles on a machine that has never
  // seen the L816 codec.

  lint {
    abortOnError false
  }
}
