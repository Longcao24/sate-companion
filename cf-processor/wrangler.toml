# SATE async device-session processor — Cloudflare Worker + Container.
#
# The Worker is a thin trigger. The Container is a long-lived Python process that
# polls Supabase, claims a queued session, HOLDS the long AI (ngrok) call outside
# any serverless wall-clock, copies the audio into the recordings bucket, then calls
# the `finalize-session` edge to write the recording. This is the piece that fixes
# "stuck in processing" for long takes — a container has no 150s limit like an edge
# function does.

name = "sate-processor"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# The container image (Python). One instance is enough — GPU concurrency is 1 anyway,
# and the poll loop drains the queue serially.
[[containers]]
class_name = "ProcessorContainer"
image = "./Dockerfile"
max_instances = 1
instance_type = "standard-1"

[[durable_objects.bindings]]
name = "PROCESSOR"
class_name = "ProcessorContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProcessorContainer"]

# Non-secret config. Secrets (SUPABASE_SERVICE_KEY, AI_PROCESS_URL, TICK_SECRET) are
# set with `wrangler secret put` — see README.
[vars]
SUPABASE_URL = "https://zlgdpivcbmaodgokkdvz.supabase.co"
FINALIZE_URL = "https://zlgdpivcbmaodgokkdvz.supabase.co/functions/v1/finalize-session"
# 🛑 THE WATCHDOG MUST OUTLAST THE LONGEST LEGITIMATE JOB, or it reclaims work that is
# still running. It was 45 while AI_READ_TIMEOUT_S is 3600 (60 min), so any take needing
# 45-60 min of transcription was requeued MID-TRANSCRIPTION: the GPU work was thrown away,
# an attempt was burned, and after MAX_ATTEMPTS it landed in 'error' — a take that was
# being processed correctly. Nothing hit it while uploads died at ~10 minutes; lifting the
# upload ceiling made it reachable. 90 = the 60-min AI ceiling + the 15-min download read
# ceiling + finalize, with room to spare.
# ⚠️ device-api's adminStatus has its own copy of this number. Change both.
STUCK_MINUTES = "90"
MAX_ATTEMPTS = "3"
# Refuse a take the AI cannot finish inside its read ceiling, instead of failing it three
# times at an hour each. 4 h; see MAX_AUDIO_SEC in app/processor.py.
MAX_AUDIO_SEC = "14400"
POLL_INTERVAL = "10"   # seconds between empty-queue polls
WORKER_ID = "cf-container-1"

[observability]
enabled = true
